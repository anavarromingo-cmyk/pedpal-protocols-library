name: Actualizar protocolos desde pedpal.es

on:
  schedule:
    - cron: "17 6 * * 1"        # cada lunes 06:17 UTC
  workflow_dispatch: {}          # botón "Run workflow" en GitHub
  push:
    paths:
      - "pipeline/**"
      - ".github/workflows/update-protocolos.yml"

permissions:
  contents: write

concurrency:
  group: update-protocolos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependencias
        run: pip install -r pipeline/requirements.txt

      - name: Descargar, extraer e indexar
        run: python pipeline/build.py

      - name: ¿Hay cambios en docs/?
        id: diff
        run: |
          git add -A docs pipeline/REPORT.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit y push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "pedpal-protocolos-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: actualización automática de protocolos ($(date -u +%Y-%m-%d))" -m "$(sed -n '1,40p' pipeline/REPORT.md)"
          git push

      - name: Resumen en la ejecución
        run: cat pipeline/REPORT.md >> "$GITHUB_STEP_SUMMARY"
